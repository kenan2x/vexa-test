# Qwen3-ASR via vLLM (production): vLLM does the batched/async ASR on the GPU,
# a thin CPU adapter adds Turkish word timestamps + the Vexa response shape.
#
# The adapter is named `qwen-asr` and listens on 8084 — same as before — so the
# compose stack's QWEN_TRANSCRIPTION_SERVICE_URL (…:8084/v1/audio/transcriptions)
# keeps working unchanged.
#
# Bring up:  GPU_DEVICE_ID=0 GPU_MEM_UTIL=0.15 API_TOKEN=<token> docker compose -f docker-compose.vllm.yml up -d
# NOTE: the H200 is SHARED — GPU_MEM_UTIL is a fraction of TOTAL VRAM, not free.
# 0.6 tries to grab ~84GB and fails if other jobs are running. 0.15 (~21GB) is plenty for 1.7B.

services:
  qwen-vllm:
    image: ${VLLM_IMAGE:-vexa-qwen-vllm:offline}
    container_name: qwen-vllm
    environment:
      - GPU_MEM_UTIL=${GPU_MEM_UTIL:-0.15}     # frac of TOTAL VRAM (H200 140GB→~21GB). 1.7B is tiny; H200 is shared, so don't grab 0.6
      - MAX_MODEL_LEN=${MAX_MODEL_LEN:-4096}
      - HF_HUB_OFFLINE=1
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICE_ID:-0}']
              capabilities: [gpu]
    restart: unless-stopped
    networks: [qwen-net]

  qwen-adapter:
    image: ${ADAPTER_IMAGE:-vexa-qwen-adapter:offline}
    container_name: qwen-asr            # keep the old name → existing wiring/logs work
    ports:
      - "8084:8084"
    environment:
      - VLLM_URL=http://qwen-vllm:8000/v1/audio/transcriptions
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-ASR-1.7B}
      - API_TOKEN=${API_TOKEN:?set API_TOKEN}
      - ALIGN_DEVICE=cpu
      - DEFAULT_LANG=tr
      - MIN_AUDIO_SEC=${MIN_AUDIO_SEC:-1.2}    # drop garbled short drafts
      - VAD_ENABLED=${VAD_ENABLED:-1}          # Silero gate: cut silence → no hallucination. Set 0 to A/B test
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.5}    # raise → stricter (less noise as speech)
      - VAD_MIN_SILENCE_MS=${VAD_MIN_SILENCE_MS:-300}
    depends_on: [qwen-vllm]
    restart: unless-stopped
    networks: [qwen-net]

networks:
  qwen-net:
    driver: bridge
